{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
    <div class="gradient-bg px-6 py-4">
        <h2 class="text-2xl font-bold text-white">Login</h2>
    </div>
    <form method="POST" action="{{ url_for('login') }}" class="p-6">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
            <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
        </div>
        <button type="submit" class="w-full gradient-bg text-white font-bold py-2 rounded-lg hover:shadow-lg transition">
            Login
        </button>
    </form>
    <div class="px-6 pb-6 text-center">
        <p class="text-gray-600">Don't have an account? <a href="{{ url_for('register') }}" class="text-purple-600 hover:text-purple-800">Register</a></p>
    </div>
</div>
{% endblock %}
