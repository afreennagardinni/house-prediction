{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
    <div class="gradient-bg px-6 py-4">
        <h2 class="text-2xl font-bold text-white">🏠 Predict House Price</h2>
        <p class="text-white mt-1">Fill in the details below to get an estimated price</p>
    </div>
    
    <form method="POST" class="p-6">
        <div class="grid md:grid-cols-2 gap-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Area (sq ft) *</label>
                <input type="number" name="area" required 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       placeholder="Enter area in square feet">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Bedrooms *</label>
                <input type="number" name="bedrooms" min="1" max="10" required 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       placeholder="Number of bedrooms">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Bathrooms *</label>
                <input type="number" name="bathrooms" min="1" max="10" required 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       placeholder="Number of bathrooms">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Stories *</label>
                <input type="number" name="stories" min="1" max="5" required 
                       class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       placeholder="Number of stories">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Main Road Access</label>
                <select name="mainroad" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Guest Room</label>
                <select name="guestroom" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Basement</label>
                <select name="basement" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Hot Water Heating</label>
                <select name="hotwaterheating" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Air Conditioning</label>
                <select name="airconditioning" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Parking Spaces</label>
                <input type="number" name="parking" min="0" max="5" required 
                       class="w-full px-3 py-2 border rounded-lg"
                       placeholder="Number of parking spaces">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Preferred Area</label>
                <select name="prefarea" class="w-full px-3 py-2 border rounded-lg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Furnishing Status</label>
                <select name="furnishingstatus" class="w-full px-3 py-2 border rounded-lg">
                    <option value="furnished">Fully Furnished</option>
                    <option value="semi-furnished">Semi-Furnished</option>
                    <option value="unfurnished">Unfurnished</option>
                </select>
            </div>
        </div>
        
        <div class="mt-8">
            <button type="submit" class="w-full gradient-bg text-white font-bold py-3 rounded-lg hover:shadow-lg transition transform hover:scale-105">
                🔮 Predict Price Now
            </button>
        </div>
    </form>
</div>
{% endblock %}
